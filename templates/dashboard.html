{% extends 'base.html' %}
{% block content %}
<h2>전체 상품</h2>
<form method="get">
<input name="q" value="{{ q }}" placeholder="상품명/설명 검색">
<button type="submit">검색</button>
</form>
{% for p in products %}
<div class="product-card">
<a href="{{ url_for('view_product', product_id=p['id']) }}"><strong>{{ p['title'] }}</strong></a> - {{ p['price'] }}원
</div>
{% else %}<p>등록된 상품이 없습니다.</p>{% endfor %}
{% endblock %}
