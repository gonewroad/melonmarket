{% extends 'base.html' %}
{% block content %}
<h2>상품 등록</h2>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>상품명</label><input name="title" required>
<label>설명</label><textarea name="description" required></textarea>
<label>가격</label><input name="price" type="number" min="0" required>
<button type="submit">등록</button>
</form>
{% endblock %}
