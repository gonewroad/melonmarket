{% extends 'base.html' %}
{% block content %}
<h2>{{ product['title'] }}</h2>
<p>가격: {{ product['price'] }}원</p>
<p>설명: {{ product['description'] }}</p>
<p>판매자: <a href="{{ url_for('user_view', user_id=seller['id']) }}">{{ seller['username'] }}</a></p>
{% if is_owner %}
<a href="{{ url_for('edit_product', product_id=product['id']) }}">수정</a>
<form method="post" action="{{ url_for('delete_product', product_id=product['id']) }}" style="display:inline">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
</form>
{% else %}
<a href="{{ url_for('chat_private', other_id=seller['id']) }}">1:1 채팅</a>
<a href="{{ url_for('report', target_id=product['id']) }}">신고하기</a>
{% endif %}
{% endblock %}
