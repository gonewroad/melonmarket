{% extends 'base.html' %}
{% block content %}
<h2>마이페이지</h2>
<p>아이디: {{ user['username'] }} / 잔액: {{ user['balance'] }}원</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>소개글</label><textarea name="bio">{{ user['bio'] or '' }}</textarea>
<label>현재 비밀번호 (변경 시에만)</label><input type="password" name="current_password">
<label>새 비밀번호</label><input type="password" name="new_password">
<button type="submit">저장</button>
</form>
{% endblock %}
