{% extends 'base.html' %}
{% block content %}
<h2>송금</h2>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>받는 사람 아이디</label><input name="receiver" required>
<label>금액</label><input name="amount" type="number" min="1" required>
<button type="submit">송금하기</button>
</form>
<h3>최근 송금 내역</h3>
<table><tr><th>보낸사람</th><th>받은사람</th><th>금액</th><th>일시</th></tr>
{% for h in history %}<tr><td>{{ h['sender_id'] }}</td><td>{{ h['receiver_id'] }}</td><td>{{ h['amount'] }}</td><td>{{ h['created_at'] }}</td></tr>{% endfor %}
</table>
{% endblock %}
